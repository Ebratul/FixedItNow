# Local development database only. Credentials here are throwaway defaults for a
# database that is not reachable from outside your machine; never reuse them.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fixeditnow
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: fixeditnow_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - fixeditnow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixeditnow -d fixeditnow_dev"]
      interval: 5s
      retries: 10
volumes:
  fixeditnow_pg:
