# Continuous integration. It uses NO secrets and NO production credentials: every
# value below is a throwaway for a disposable service container. It never deploys
# and never touches a real database or provider. Failed checks fail the job.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, unit, integration, migrations, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: fixeditnow_test      # the e2e runner refuses any database whose name does not end in _test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d fixeditnow_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ci:ci-throwaway@localhost:5432/fixeditnow_test
      DATABASE_URL: postgresql://ci:ci-throwaway@localhost:5432/fixeditnow_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # The cross-service contract test (test/ai-contract.e2e-spec.ts) starts the real Python
      # service; it skips itself when rag_agent/.venv is missing, so create it here.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv ../rag_agent/.venv && ../rag_agent/.venv/bin/pip install --quiet -r ../rag_agent/requirements.txt
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # applies every migration to the empty database, seeds categories, then runs the integration suite
      - run: npm run test:e2e
      - name: Migration drift (schema.prisma must equal the migrations)
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm audit --audit-level=high

  frontend:
    name: Frontend (lint, types, tests, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  ai-service:
    name: AI service (ruff, mypy, pytest + offline evaluation, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rag_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rag_agent/requirements-dev.txt
      - run: pip install -r requirements-dev.txt pip-audit
      - run: ruff check .
      - run: mypy
      - run: pytest -q          # includes the evaluation set (tests/test_eval.py)
      - run: pip-audit -r requirements.txt

  images:
    name: Container images build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend, ai-service]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runtime -t fixeditnow-api backend
      - run: docker build --target migrate -t fixeditnow-migrate backend
      - run: docker build --build-arg BACKEND_URL=http://api:4000 -t fixeditnow-web frontend
      - run: docker build -t fixeditnow-ai rag_agent
